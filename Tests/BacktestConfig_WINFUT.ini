;     ProfitFactor  >= 1.4
;     MaxDrawdown   <= 15% do deposito
;     SharpeRatio   >= 0.8
;     WFE           >= 0.50  (Lucro_OOS / Lucro_IS)
;     WinRate       >= 45%
;
; PARAMETROS OTIMIZAVEIS v2.0 (carregar DualTrendScalper_Default.set):
;   EMA_Rapida, EMA_Lenta, EMA_Tendencia
;   MACD_R_WIN, MACD_L_WIN, MACD_S_WIN
;   ATR_Mult_SL, ATR_Filtro_Pct
;   RSI_Min_Compra, RSI_Max_Venda
;   RR_Ratio, BE_Pct, Trailing_Pct
;
; COMO USAR:
;   1. Abrir Strategy Tester no MT5 (Ctrl+R)
;   2. Carregar este .ini via File > Load Settings
;   3. Inputs > Load > DualTrendScalper_Default.set
;   4. Optimization: Genetic algorithm | Passes >= 1000
;   5. Apos IS: verificar OOS automatico (ForwardMode=Custom)
; ===========================================================


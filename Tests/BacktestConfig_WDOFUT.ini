; ===========================================================
; BACKTEST CONFIG v2.0 — WDOFUT (Mini Dolar)
; DualTrendScalper v2.0 | Corretora: XP Investimentos
; Ultima revisao: 2026-07-24
; ===========================================================
;
; PERIODO:
;   In-Sample  (IS):  2023-01-02 a 2025-06-30  (30 meses)
;   Out-of-Sample (OOS): 2025-07-01 a 2026-06-30  (12 meses)
;
; ATENCAO WDO: parametros MACD sao DIFERENTES do WIN!
;   MACD_R_WDO=8, MACD_L_WDO=21, MACD_S_WDO=5
;   ATR_Mult_SL=1.5 (WDO eh mais volatil que WIN)
;   Janelas: 10h-12h e 14h-15:30h (abertura mercado EUA)
;
; CRITERIO DE AVALIACAO (OptimizationCriterion=6 = OnTester customizado):
;   OnTester() = SharpeRatio * ProfitFactor + RecoveryFactor * 0.1
;   Minimos para aprovacao:
;     ProfitFactor  >= 1.4
;     MaxDrawdown   <= 15% do deposito
;     SharpeRatio   >= 0.8
;     WFE           >= 0.50
;     WinRate       >= 45%
;
; PARAMETROS OTIMIZAVEIS v2.0 (carregar DualTrendScalper_Default.set):
;   MACD_R_WDO, MACD_L_WDO, MACD_S_WDO  <-- principais para WDO
;   ATR_Mult_SL (range 1.0-2.5 para WDO)
;   ATR_Filtro_Pct
;   RSI_Min_Compra, RSI_Max_Venda
;   RR_Ratio
;   MaxTradesWIN=0  <-- fixo para rodar SOM WDO isolado
;
; COMO USAR:
;   1. Abrir Strategy Tester no MT5 (Ctrl+R)
;   2. Carregar este .ini via File > Load Settings
;   3. Inputs > Load > DualTrendScalper_WDO.set
;   4. Optimization: Genetic algorithm | Passes >= 1000
;   5. Apos IS: verificar OOS automatico (ForwardMode=Custom)
; ===========================================================

[Tester]
Expert=Experts\DualTrendScalper.mq5
Symbol=WDOFUT
Period=M5
ModelingMode=EveryTick
FromDate=2023.01.02
ToDate=2025.06.30
ForwardMode=Custom
ForwardDate=2025.07.01
ForwardToDate=2026.06.30
Deposit=50000
Currency=BRL
Leverage=1:1
Optimization=1
OptimizationCriterion=6
Report=Reports\WDOFUT_v2_Backtest
ReplaceReport=1
ShutdownTerminal=0
VisualMode=0
ExecutionDelay=5
Spread=3
